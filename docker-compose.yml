# Whole stack without installing Node or MySQL on the machine:
#   cp .env.example .env   (fill it in)
#   docker compose up --build --watch
# See README.md for details.
name: baki-khata

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: baki_khata_mobile
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 3307 on the host so it does not clash with a locally installed MySQL.
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/baki_khata_mobile
      TEST_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/baki_khata_mobile_test
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ characters) in .env}
      PORT: 4000
      UPLOAD_DIR: /data/uploads
    ports:
      - "4000:4000"
    volumes:
      - uploads:/data/uploads
    develop:
      watch:
        - action: sync+restart
          path: ./apps/api/src
          target: /app/apps/api/src
        - action: sync+restart
          path: ./apps/api/drizzle
          target: /app/apps/api/drizzle
        - action: sync+restart
          path: ./packages/shared/src
          target: /app/packages/shared/src
        - action: rebuild
          path: ./package-lock.json

  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    init: true
    tty: true
    stdin_open: true
    depends_on:
      - api
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:?Set HOST_IP (this computer's LAN IP) in .env}
      EXPO_PUBLIC_API_URL: http://${HOST_IP}:4000
    ports:
      - "8081:8081"
    develop:
      watch:
        - action: sync
          path: ./apps/mobile/src
          target: /app/apps/mobile/src
        - action: sync
          path: ./packages/shared/src
          target: /app/packages/shared/src
        - action: rebuild
          path: ./apps/mobile/app.json
        - action: rebuild
          path: ./package-lock.json

volumes:
  db-data:
  uploads:
